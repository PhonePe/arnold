# Arnold runner pipeline for runner.mode: GITLAB.
#
# Put this file (or an `include:` of it) in the runner project's .gitlab-ci.yml. Arnold starts pipelines through the
# pipeline trigger API and passes the job as pipeline variables (WORKFLOW, ARNOLD_RUN_ID, MR_LINK, ...).
#
# Configure these as masked + protected CI/CD variables in the runner project:
#   ARNOLD_URL, ARNOLD_RUNNER_API_KEY   callback endpoint and runner API key (backend auth.apiKeys)
#   GITLAB_ACCESS_TOKEN                 token used to read MRs and post review comments
#   CLIO_LLM_BASE_URL, CLIO_LLM_API_KEY  OpenAI-compatible LLM endpoint (OpenCode and simple LLM calls)
#   GITHUB_TOKEN                        only for the opt-in Copilot harness without Arnold execution keys
#
# The image is fixed here rather than read from a variable: anyone able to trigger the pipeline could otherwise point
# it at an image of their choosing and receive the masked variables above. To use a mirror or a pinned version, edit
# this line in your copy.

arnold-runner:
  image: ghcr.io/phonepe/arnold-runner:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $WORKFLOW'
  script:
    - python /app/main.py job
  timeout: 2h 45m
