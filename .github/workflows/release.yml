name: release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arnold-server
            context: arnold-backend/arnold-server
            build_jar: true
          - name: arnold-ui
            context: arnold-ui
          - name: arnold-runner
            context: arnold-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.build_jar
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Build server jar
        if: matrix.build_jar
        run: mvn -B -f arnold-backend/pom.xml -DskipTests package
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          labels: |
            org.opencontainers.image.title=PhonePe Arnold ${{ matrix.name }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
