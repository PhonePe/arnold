name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: License headers
        run: python3 scripts/license_headers.py --check
      - name: Internal references
        run: scripts/check_internal_refs.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Build and test
        run: mvn -B -f arnold-backend/pom.xml verify

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arnold-ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: arnold-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:deployment
      - run: node --test src/lib/*.test.mjs
      - run: pnpm build

  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arnold-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: arnold-runner/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
