# Grouped weekly updates; major versions are handled manually. Security updates are unaffected.
version: 2
updates:
  - package-ecosystem: maven
    directory: /arnold-backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /arnold-ui
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /arnold-runner
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
