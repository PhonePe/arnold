title = "arnold gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholders, test fixtures and untracked local build output"
regexes = [
  '''\$\{[A-Z0-9_]+(:-[^}]*)?\}''',
  '''REPLACE_ME''',
  '''0123456789abcdef0123456789abcdef''',
  '''fedcba9876543210fedcba9876543210''',
  '''-----BEGIN PRIVATE KEY-----\\n" \+ java\.util\.Base64''',
]
paths = ['''(^|/)(package-lock\.json|pnpm-lock\.yaml)$''', '''(^|/)\.next/''', '''(^|/)\.idea/''']
