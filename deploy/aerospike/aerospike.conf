# Single-node development configuration. nsup-period must be non-zero because Arnold writes records with a TTL.
service {
	cluster-name arnold-dev
	proto-fd-max 15000
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}
	heartbeat {
		mode mesh
		port 3002
		interval 150
		timeout 10
	}
	fabric {
		port 3001
	}
}

namespace test {
	replication-factor 1
	nsup-period 120
	default-ttl 0
	storage-engine memory {
		data-size 1G
	}
}
