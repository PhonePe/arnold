default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no AI attribution in commit message
        entry: scripts/check_commit_message.sh
        language: script
        stages: [commit-msg]
