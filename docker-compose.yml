# Local quick start: Arnold backend, UI, a local review runner and Aerospike.
#
#   cp deploy/.env.example .env   # then uncomment and fill in GitLab/GitHub and LLM settings
#   docker compose up             # pulls the released images; ARNOLD_VERSION picks another release
#
# To run your own changes, build from source with the dev override:
#   mvn -f arnold-backend/pom.xml -DskipTests package
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Open http://localhost:3000. Development auth is enabled: no sign-in, every request acts as a local admin.
# For stats, set ELASTIC_ENABLED=true in .env and add the `analytics` profile (`docker compose --profile analytics up`).
name: arnold

services:
  aerospike:
    image: aerospike/aerospike-server:7.2.0.1
    command: ["--config-file", "/opt/aerospike/etc/aerospike.conf"]
    volumes:
      - ./deploy/aerospike:/opt/aerospike/etc:ro
      - aerospike-data:/opt/aerospike/data
    healthcheck:
      test: ["CMD-SHELL", "asinfo -v 'cluster-stable:' | grep -qv -e ERROR -e '^$'"]
      interval: 3s
      start_period: 5s
      retries: 30

  elasticsearch:
    profiles: ["analytics"]
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.25
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m

  server:
    image: ghcr.io/phonepe/arnold-server:${ARNOLD_VERSION:-v1.0.0}
    restart: on-failure
    depends_on:
      aerospike:
        condition: service_healthy
    env_file: [.env]
    environment:
      AEROSPIKE_HOSTS: aerospike
      ELASTIC_HOST: elasticsearch
      ARNOLD_DEV_AUTH: "true"
      ARNOLD_UI_URL: http://localhost:3000
      ARNOLD_RUNNER_MODE: LOCAL
    ports: ["8090:8090", "8091:8091"]

  ui:
    image: ghcr.io/phonepe/arnold-ui:${ARNOLD_VERSION:-v1.0.0}
    depends_on: [server]
    environment:
      ARNOLD_API_URL: http://server:8090
      ARNOLD_ALLOW_DEV_AUTH: "true"
    volumes:
      - ./deploy/ui/development.yaml:/app/config/production.yaml:ro
    ports: ["3000:3000"]

  runner:
    image: ghcr.io/phonepe/arnold-runner:${ARNOLD_VERSION:-v1.0.0}
    command: ["worker", "--concurrency", "1"]
    depends_on: [server]
    env_file: [.env]
    environment:
      ARNOLD_URL: http://server:8090

volumes:
  aerospike-data:
