application:
  devMode: false
server:
  host: localhost
  port: 3000
api:
  host: http://localhost:8090
  domain: localhost
  port: 8090
auth:
  # "dev" skips sign-in and relies on the backend's auth.dev mode. Use "oauth" with providers to test real sign-in.
  mode: dev
  publicUrl: http://localhost:3000
  sessionSecret: local-development-secret-change-me-0123456789
  providers: []
