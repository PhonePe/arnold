application:
  devMode: false
server:
  host: 0.0.0.0
  port: 3000
api:
  host: https://arnold-api.example.com
  domain: arnold-api.example.com
  port: 443
auth:
  mode: oauth
  # Externally reachable URL of this UI; provider callbacks are {publicUrl}/auth/callback/{providerId}.
  publicUrl: https://arnold.example.com
  # Shared with the backend (serviceCoreConfiguration.auth.jwt.issuers[issuer=arnold-ui].secret). At least 32 bytes.
  sessionSecret: REPLACE_ME
  sessionTtlSeconds: 43200
  # Optional: only allow these email domains.
  allowedEmailDomains: []
  providers:
    - id: github
      type: github
      label: GitHub
      clientId: REPLACE_ME
      clientSecret: REPLACE_ME
      # Optional: restrict sign-in to members of these organizations.
      allowedOrganizations: []
    - id: google
      type: oidc
      label: Google
      issuer: https://accounts.google.com
      clientId: REPLACE_ME
      clientSecret: REPLACE_ME
    - id: sso
      type: oidc
      label: Company SSO
      issuer: https://sso.example.com/realms/engineering
      clientId: REPLACE_ME
      clientSecret: REPLACE_ME
      groupsClaim: groups
