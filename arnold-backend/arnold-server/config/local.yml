server:
  maxThreads: 128
  minThreads: 128
  applicationConnectors:
    - type: http
      port: 8090
  adminConnectors:
    - type: http
      port: 8091
  applicationContextPath: /
  requestLog:
    appenders:
      - type: console
        timeZone: IST

logging:
  level: INFO
  loggers:
    com.phonepe: INFO
    org.hibernate: ERROR
  appenders:
    - type: console
      threshold: INFO
      timeZone: IST
      logFormat: "%(%-5level) [%date] [%thread] [%logger{0}]: %message%n"

hystrixConfig:
  defaultConfig:
    threadPool:
      timeout: 2000
      concurrency: 10
  commands:
    - name: SampleClient.sampleMethod
      threadPool:
        timeout: 10000
        concurrency: 10
    # Note enrichment is fanned out one call per review comment, so this command is the
    # hot path. Give it a dedicated pool + an explicit queue rejection threshold instead of
    # relying on the library default (dynamicRequestQueueSize=16), which caused rejections.
    - name: CibotServiceHttpImpl.getMergeRequestNote
      threadPool:
        timeout: 2000
        concurrency: 20
        maxRequestQueueSize: 128
        dynamicRequestQueueSize: 64

platformBundle:
  serviceName: arnold
  serviceDiscovery:
    namespace: phonepe
    environment: local
    zookeeper: localhost:2181
    publishedHost: localhost
    publishedPort: 8080

  rangerHub:
    type: HTTP
    namespace: phonepe
    nodeRefreshTimeMs: 5000
    hubHost: internal.example
    port: 80
    secure: false
    services:
      - clientId: SAMPLE_SERVICE
        serviceComponentId: SAMPLE_SERVICE_CIG
        usingRegistry: true
        environment: stage
        connections: 10
        idleTimeOutSeconds: 30
      - clientId: CIBOT
        usingZookeeper: false
        namespace: phonepe
        serviceName: autopsy
        host: localhost
        port: 8080
        environment: stage
        connections: 10
        idleTimeOutSeconds: 30
        connectTimeoutMs: 864000
        opTimeoutMs: 864000
        secure: false
      - clientId: GITLAB
        usingZookeeper: false
        usingRegistry: false
        namespace: phonepe
        host: gitlab.example.com
        port: 443
        secure: true
        environment: stage
        connections: 10
        idleTimeOutSeconds: 30
        connectTimeoutMs: 30000
        opTimeoutMs: 30000

  reporterConfig:
    enableMicrometer: true
    prefix: phonepe.local.arnold
    pollingInterval: 30
    attributes:
      env: local
    cluster: arnold
    metricServiceConfig:
      namespace: phonepe
      logLevel: BASIC
      zookeeper: internal.example:2181,internal.example:2181,internal.example:2181
      httpConfiguration:
        clientId: metricIngestionClient
        usingZookeeper: false
        host: internal.example
        serviceName: metricingestion
        environment: stage
        connections: 10
        idleTimeOutSeconds: 30
    farm: NB6

  swagger:
    title: Arnold
    resourcePackage: com.phonepe.devx.arnold.core.resources

  requestValidation:
    headerValidationConfig:
      validateRelativePathValue: true
      headersVsForbiddenRegexList:
        X-DEVICE-FINGERPRINT:
          - \+.\/
          - \.+\\
    pathValidationConfig:
      validateHttpRelativePath: true
      forbiddenRegexList:
        - \.+\/
        - \.+\\

  olympusIM:
    httpConfig:
      clientId: olympus
      usingZookeeper: false
      host: idp.example.com
      port: 443
      secure: true
      serviceName: olympusIM
      environment: stage
      connections: 10
      idleTimeOutSeconds: 30
    authConfig:
      componentId: ARNOLD
      componentInstanceId: ARNOLD_NB6
      clientId: ARNOLD_NB6
      clientKey: ***REMOVED***
    publicEndpoint: http://localhost:10000
    authEndpoint: https://idp.example.com
    resourcePrefix: /olympus/im

  eventIngestion:
    syncClientConfig:
      clientId: eventIngestion
      farmId: NB6
      usingRegistry: false
      serviceComponentId: EVENTS_INGESTION_API_GROUP
      host: internal.example
      port: 443
      secure: true
      namespace: phonepe
      clientType: sync

sampleAppConfiguration:
  clientId: sampleService
  usingZookeeper: false
  environment: stage
  host: internal.example
  port: 80
  connections: 10
  secure: false
  idleTimeOutSeconds: 30
  authIssuer: OLYMPUS

elasticSearchConfiguration:
  columbus:
    storages:
      - type: ELASTIC
        enabled: true
        name: arnold-es-cluster
        hosts:
          endpoints:
            - host: internal.example
              port: 9200
              scheme: https
            - host: internal.example
              port: 9200
              scheme: https
            - host: internal.example
              port: 9200
              scheme: https
        auth:
          credentials:
            username: elastic
            password: ***REMOVED***
        requestConfig:
          defaultHeaders:
            - name: "Accept"
              value: "application/vnd.elasticsearch+json; compatible-with=7"
            - name: "Content-Type"
              value: "application/vnd.elasticsearch+json; compatible-with=7"
        indices:
          registry:
            CORE_REVIEWS: "arnold.code.reviews"
            CORE_MERGE_REQUESTS: "arnold.merge.requests"
            CORE_COMMENTS: "arnold.comments"
serviceCoreConfiguration:
  copilotConfiguration:
    enabled: true
    clientId: Iv1.b507a08c87ecfe98
    credentialSet: arnold-copilot-v1
    encryptionKey: "test"
  asyncExecutor:
    coreSize: 10
    maxSize: 20
    queueCapacity: 512
    keepAliveSeconds: 60
    shutdownAwaitSeconds: 30
  aerospikeStorageConfiguration:
    reviewSet:
      namespace: test
      set: arnold-review-v1
    userSet:
      namespace: test
      set: arnold-user-v1
    changeRequestSet:
      namespace: test
      set: arnold-change-request-v1
    mergeQueueSet:
      namespace: test
      set: arnold-merge-queue-v1
    commentSet:
      namespace: test
      set: arnold-comment-v1
    webhookDeliverySet:
      namespace: test
      set: arnold-webhook-delivery-v1
    projectionEventSet:
      namespace: test
      set: arnold-projection-event-v1
    analysisRunSet:
      namespace: test
      set: arnold-analysis-run-v1
    groupAnalysisRunSet:
      namespace: test
      set: arnold-group-analysis-run-v1
    versionControlCredentialSet:
      namespace: test
      set: arnold-vcs-credential-v1
    oauthStateSet:
      namespace: test
      set: arnold-oauth-state-v1
    userChangeRequestSet:
      namespace: test
      set: arnold-user-change-request-v1
    userSyncStateSet:
      namespace: test
      set: arnold-user-sync-state-v1
    providerIdentityLinkSet:
      namespace: test
      set: arnold-provider-identity-link-v1
    notificationSet:
      namespace: test
      set: arnold-notification-inbox-v2
    mergeRequestGroupSet:
      namespace: test
      set: arnold-merge-request-group-v1
    mergeRequestGroupV2Set:
      namespace: test
      set: arnold-merge-request-group-v2
    clusterControlSet:
      namespace: test
      set: arnold-cluster-control-v1
    personaSet:
      namespace: test
      set: arnold-persona-v1

  userSyncConfiguration:
    intervalMs: 900000
    leaseMs: 300000
    workerBatchSize: 25
    maxConcurrentUsers: 4
    leaderLeaseMs: 120000

  gitlabSyncConfiguration:
    webhookSecret: local-webhook-secret
    historyWindowMs: 7776000000
    watermarkOverlapMs: 300000

  gitlabConfiguration:
    baseUrl: https://gitlab.example.com
    clientId: "***REMOVED***"
    clientSecret: "***REMOVED***"
    callbackUrl: "http://internal.example/gitlab/oauth/callback"
    oauthStateTtlMs: 600000
    tokenRefreshBufferMs: 60000
    requestTimeoutMs: 30000
    clio:
      projectId: 17352
      projectPath: devx/clio
      ref: "sub-agents"
      triggerToken: "***REMOVED***"

  slackClientConfig:
    enabled: false
    host: internal.example
    port: 443
    secure: true
    clientId: slack
    botToken: ${ARNOLD_SLACK_TOKEN}
    uiBaseUrl: http://internal.example

aerospike:
  hosts: "localhost"
  port: 3000
  retries: 5
  sleepBetweenRetries: 500
  timeout: 500
  maxConnectionsPerNode: 10
