server:
  maxThreads: 128
  minThreads: 128
  applicationConnectors:
    - type: http
      port: 8090
  adminConnectors:
    - type: http
      port: 8091
  applicationContextPath: /
  requestLog:
    appenders:
      - type: console
        timeZone: UTC

logging:
  level: INFO
  loggers:
    com.phonepe.arnold: INFO
    org.hibernate: ERROR
  appenders:
    - type: console
      threshold: INFO
      timeZone: UTC
      logFormat: "%(%-5level) [%date] [%thread] [%logger{0}]: %message%n"

swagger:
  title: Arnold
  resourcePackage: com.phonepe.arnold.core.resources

elasticSearchConfiguration:
  columbus:
    storages:
      - type: ELASTIC
        enabled: true
        name: arnold-es-cluster
        hosts:
          endpoints:
            - host: ${ELASTIC_HOST:-localhost}
              port: ${ELASTIC_PORT:-9200}
              scheme: ${ELASTIC_SCHEME:-http}
        auth:
          credentials:
            username: ${ELASTIC_USERNAME:-elastic}
            password: ${ELASTIC_PASSWORD:-changeme}
        requestConfig:
          defaultHeaders:
            - name: "Accept"
              value: "application/vnd.elasticsearch+json; compatible-with=7"
            - name: "Content-Type"
              value: "application/vnd.elasticsearch+json; compatible-with=7"
        indices:
          registry:
            CORE_REVIEWS: "arnold.code.reviews"
            CORE_MERGE_REQUESTS: "arnold.merge.requests"
            CORE_COMMENTS: "arnold.comments"
            CORE_ANALYSIS_RUNS: "arnold.analysis.runs"
            CORE_REVIEW_ENGAGEMENT: "arnold.review.engagement"
serviceCoreConfiguration:
  # Authentication. See AuthConfiguration for all options.
  auth:
    dev:
      # Authenticates requests without a bearer token as a local superadmin. Never enable in production.
      enabled: ${ARNOLD_DEV_AUTH:-true}
    jwt:
      issuers:
        - issuer: arnold-ui
          audience: arnold
          secret: ${ARNOLD_UI_JWT_SECRET:-local-development-secret-change-me-0123456789}
    apiKeys:
      - name: runner
        key: ${ARNOLD_RUNNER_API_KEY:-}
        roles: [runner_execute, analysis_callback_write, smart_diff_callback_write, review_feedback_write]
    admins: []
  copilotConfiguration:
    # Opt-in; see CopilotConfiguration for the caveats before enabling.
    enabled: ${COPILOT_ENABLED:-false}
    jobTokenExchangeEnabled: ${COPILOT_ENABLED:-false}
    clientId: ${COPILOT_CLIENT_ID:-}
    credentialSet: arnold-copilot-v1
    encryptionKey: "${COPILOT_ENCRYPTION_KEY:-}"
  openCodeConfiguration:
    enabled: ${OPENCODE_ENABLED:-true}
    provider: ${OPENCODE_PROVIDER:-openai}
    modelsUrl: ${OPENCODE_MODELS_URL:-}
    apiKey: ${OPENCODE_API_KEY:-}
  asyncExecutor:
    coreSize: 10
    maxSize: 20
    queueCapacity: 512
    keepAliveSeconds: 60
    shutdownAwaitSeconds: 30
  aerospikeStorageConfiguration:
    reviewSet:
      namespace: test
      set: arnold-review-v1
    userSet:
      namespace: test
      set: arnold-user-v1
    changeRequestSet:
      namespace: test
      set: arnold-change-request-v1
    mergeQueueSet:
      namespace: test
      set: arnold-merge-queue-v1
    commentSet:
      namespace: test
      set: arnold-comment-v1
    webhookDeliverySet:
      namespace: test
      set: arnold-webhook-delivery-v1
    projectionEventSet:
      namespace: test
      set: arnold-projection-event-v1
    analysisRunSet:
      namespace: test
      set: arnold-analysis-run-v1
    groupAnalysisRunSet:
      namespace: test
      set: arnold-group-analysis-run-v1
    versionControlCredentialSet:
      namespace: test
      set: arnold-vcs-credential-v1
    oauthStateSet:
      namespace: test
      set: arnold-oauth-state-v1
    userChangeRequestSet:
      namespace: test
      set: arnold-user-change-request-v1
    userSyncStateSet:
      namespace: test
      set: arnold-user-sync-state-v1
    providerIdentityLinkSet:
      namespace: test
      set: arnold-provider-identity-link-v1
    notificationSet:
      namespace: test
      set: arnold-notification-inbox-v2
    mergeRequestGroupSet:
      namespace: test
      set: arnold-merge-request-group-v1
    mergeRequestGroupV2Set:
      namespace: test
      set: arnold-merge-request-group-v2
    clusterControlSet:
      namespace: test
      set: arnold-cluster-control-v1
    personaSet:
      namespace: test
      set: arnold-persona-v1

  userSyncConfiguration:
    intervalMs: 900000
    leaseMs: 300000
    workerBatchSize: 25
    maxConcurrentUsers: 4
    leaderLeaseMs: 120000

  gitlabSyncConfiguration:
    webhookSecret: ${GITLAB_WEBHOOK_SECRET:-local-webhook-secret}
    historyWindowMs: 7776000000
    watermarkOverlapMs: 300000

  gitlabConfiguration:
    baseUrl: ${GITLAB_URL:-https://gitlab.com}
    clientId: "${GITLAB_OAUTH_CLIENT_ID:-}"
    clientSecret: "${GITLAB_OAUTH_CLIENT_SECRET:-}"
    callbackUrl: "${ARNOLD_UI_URL:-http://localhost:3000}/gitlab/oauth/callback"
    oauthStateTtlMs: 600000
    tokenRefreshBufferMs: 60000
    requestTimeoutMs: 30000
    serviceToken: ${GITLAB_SERVICE_TOKEN:-}

  # Where review workflows run: LOCAL (self-hosted `arnold-runner worker`), GITLAB (CI pipelines) or GITHUB (Actions).
  runner:
    mode: ${ARNOLD_RUNNER_MODE:-LOCAL}
    local:
      leaseSeconds: 300
      maxAttempts: 2
    gitlab:
      projectId: ${RUNNER_GITLAB_PROJECT_ID:-0}
      projectPath: ${RUNNER_GITLAB_PROJECT_PATH:-}
      ref: ${RUNNER_GITLAB_REF:-main}
      triggerToken: ${RUNNER_GITLAB_TRIGGER_TOKEN:-}
    github:
      apiUrl: ${RUNNER_GITHUB_API_URL:-https://api.github.com}
      repository: ${RUNNER_GITHUB_REPOSITORY:-}
      workflow: ${RUNNER_GITHUB_WORKFLOW:-arnold-runner.yml}
      ref: ${RUNNER_GITHUB_REF:-main}
      token: ${RUNNER_GITHUB_TOKEN:-}

  slackClientConfig:
    enabled: false
    url: ${SLACK_API_URL:-https://slack.com}
    botToken: "${ARNOLD_SLACK_TOKEN:-}"
    uiBaseUrl: ${ARNOLD_UI_URL:-http://localhost:3000}

aerospike:
  hosts: ${AEROSPIKE_HOSTS:-localhost}
  port: 3000
  retries: 5
  sleepBetweenRetries: 500
  timeout: 500
  maxConnectionsPerNode: 10
