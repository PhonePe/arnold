server:
  maxThreads: 128
  minThreads: 128
  applicationConnectors:
    - type: http
      port: 8090
  adminConnectors:
    - type: http
      port: 8091
  applicationContextPath: /
  requestLog:
    appenders:
      - type: console
        timeZone: IST

logging:
  level: INFO
  loggers:
    com.phonepe: INFO
    org.hibernate: ERROR
  appenders:
    - type: console
      threshold: INFO
      timeZone: IST
      logFormat: "%(%-5level) [%date] [%thread] [%logger{0}]: %message%n"

hystrixConfig:
  defaultConfig:
    threadPool:
      timeout: 2000
      concurrency: 10
  commands: []

platformBundle:
  serviceName: arnold
  serviceDiscovery:
    namespace: phonepe
    environment: local
    zookeeper: localhost:2181
    publishedHost: localhost
    publishedPort: 8080

  rangerHub:
    type: HTTP
    namespace: phonepe
    nodeRefreshTimeMs: 5000
    hubHost: internal.example
    port: 80
    secure: false
    services: []

  reporterConfig:
    enableMicrometer: true
    prefix: phonepe.local.arnold
    pollingInterval: 30
    attributes:
      env: local
    cluster: arnold
    metricServiceConfig:
      namespace: phonepe
      logLevel: BASIC
      zookeeper: internal.example:2181,internal.example:2181,internal.example:2181
      httpConfiguration:
        clientId: metricIngestionClient
        usingZookeeper: false
        host: internal.example
        serviceName: metricingestion
        environment: stage
        connections: 10
        idleTimeOutSeconds: 30
    farm: NB6

  swagger:
    title: Arnold
    resourcePackage: com.phonepe.devx.arnold.core.resources

  requestValidation:
    headerValidationConfig:
      validateRelativePathValue: true
      headersVsForbiddenRegexList:
        X-DEVICE-FINGERPRINT:
          - \+.\/
          - \.+\\
    pathValidationConfig:
      validateHttpRelativePath: true
      forbiddenRegexList:
        - \.+\/
        - \.+\\

  olympusIM:
    httpConfig:
      clientId: olympus
      usingZookeeper: false
      host: idp.example.com
      port: 443
      secure: true
      serviceName: olympusIM
      environment: stage
      connections: 10
      idleTimeOutSeconds: 30
    authConfig:
      componentId: ARNOLD
      componentInstanceId: ARNOLD_NB6
      clientId: ARNOLD_NB6
      clientKey: ${OLYMPUS_CLIENT_KEY:-}
    publicEndpoint: http://localhost:10000
    authEndpoint: https://idp.example.com
    resourcePrefix: /olympus/im



elasticSearchConfiguration:
  columbus:
    storages:
      - type: ELASTIC
        enabled: true
        name: arnold-es-cluster
        hosts:
          endpoints:
            - host: internal.example
              port: 9200
              scheme: https
            - host: internal.example
              port: 9200
              scheme: https
            - host: internal.example
              port: 9200
              scheme: https
        auth:
          credentials:
            username: ${ELASTIC_USERNAME:-elastic}
            password: ${ELASTIC_PASSWORD:-}
        requestConfig:
          defaultHeaders:
            - name: "Accept"
              value: "application/vnd.elasticsearch+json; compatible-with=7"
            - name: "Content-Type"
              value: "application/vnd.elasticsearch+json; compatible-with=7"
        indices:
          registry:
            CORE_REVIEWS: "arnold.code.reviews"
            CORE_MERGE_REQUESTS: "arnold.merge.requests"
            CORE_COMMENTS: "arnold.comments"
            CORE_ANALYSIS_RUNS: "arnold.analysis.runs"
            CORE_REVIEW_ENGAGEMENT: "arnold.review.engagement"
serviceCoreConfiguration:
  copilotConfiguration:
    enabled: true
    jobTokenExchangeEnabled: true
    clientId: Iv1.b507a08c87ecfe98
    credentialSet: arnold-copilot-v1
    encryptionKey: "${COPILOT_ENCRYPTION_KEY:-}"
  openCodeConfiguration:
    enabled: true
    provider: ${OPENCODE_PROVIDER:-openai}
    modelsUrl: ${OPENCODE_MODELS_URL:-}
    apiKey: ${OPENCODE_API_KEY:-}
  asyncExecutor:
    coreSize: 10
    maxSize: 20
    queueCapacity: 512
    keepAliveSeconds: 60
    shutdownAwaitSeconds: 30
  aerospikeStorageConfiguration:
    reviewSet:
      namespace: test
      set: arnold-review-v1
    userSet:
      namespace: test
      set: arnold-user-v1
    changeRequestSet:
      namespace: test
      set: arnold-change-request-v1
    mergeQueueSet:
      namespace: test
      set: arnold-merge-queue-v1
    commentSet:
      namespace: test
      set: arnold-comment-v1
    webhookDeliverySet:
      namespace: test
      set: arnold-webhook-delivery-v1
    projectionEventSet:
      namespace: test
      set: arnold-projection-event-v1
    analysisRunSet:
      namespace: test
      set: arnold-analysis-run-v1
    groupAnalysisRunSet:
      namespace: test
      set: arnold-group-analysis-run-v1
    versionControlCredentialSet:
      namespace: test
      set: arnold-vcs-credential-v1
    oauthStateSet:
      namespace: test
      set: arnold-oauth-state-v1
    userChangeRequestSet:
      namespace: test
      set: arnold-user-change-request-v1
    userSyncStateSet:
      namespace: test
      set: arnold-user-sync-state-v1
    providerIdentityLinkSet:
      namespace: test
      set: arnold-provider-identity-link-v1
    notificationSet:
      namespace: test
      set: arnold-notification-inbox-v2
    mergeRequestGroupSet:
      namespace: test
      set: arnold-merge-request-group-v1
    mergeRequestGroupV2Set:
      namespace: test
      set: arnold-merge-request-group-v2
    clusterControlSet:
      namespace: test
      set: arnold-cluster-control-v1
    personaSet:
      namespace: test
      set: arnold-persona-v1

  userSyncConfiguration:
    intervalMs: 900000
    leaseMs: 300000
    workerBatchSize: 25
    maxConcurrentUsers: 4
    leaderLeaseMs: 120000

  gitlabSyncConfiguration:
    webhookSecret: ${GITLAB_WEBHOOK_SECRET:-local-webhook-secret}
    historyWindowMs: 7776000000
    watermarkOverlapMs: 300000

  gitlabConfiguration:
    baseUrl: https://gitlab.example.com
    clientId: "${GITLAB_OAUTH_CLIENT_ID:-}"
    clientSecret: "${GITLAB_OAUTH_CLIENT_SECRET:-}"
    callbackUrl: "http://internal.example/gitlab/oauth/callback"
    oauthStateTtlMs: 600000
    tokenRefreshBufferMs: 60000
    requestTimeoutMs: 30000
    serviceToken: ${GITLAB_SERVICE_TOKEN:-}
    clio:
      projectId: 17352
      projectPath: devx/clio
      ref: "sub-agents"
      triggerToken: "${CLIO_TRIGGER_TOKEN:-}"

  slackClientConfig:
    enabled: false
    url: ${SLACK_API_URL:-https://slack.com}
    botToken: "${ARNOLD_SLACK_TOKEN:-}"
    uiBaseUrl: http://internal.example

aerospike:
  hosts: "localhost"
  port: 3000
  retries: 5
  sleepBetweenRetries: 500
  timeout: 500
  maxConnectionsPerNode: 10
